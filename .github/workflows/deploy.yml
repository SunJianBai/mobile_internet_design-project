name: Deploy

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional image tag. Leave empty to use the short Git SHA."
        required: false
        default: ""
      public_base_url:
        description: "Public URL used for smoke tests."
        required: false
        default: "https://sun227454.online/CampusHub"
      use_existing_bundle:
        description: "Use an image bundle already uploaded to releases/campushub-images-<tag>.tar or .tar.gz."
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: /home/ubuntu/CampusHub
      PUBLIC_BASE_URL: ${{ inputs.public_base_url }}
      USE_EXISTING_BUNDLE: ${{ inputs.use_existing_bundle }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="${GITHUB_SHA::7}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Using release tag: $tag"

      - name: Build Docker images
        if: inputs.use_existing_bundle != 'true'
        run: |
          docker build -t "campushub-agent:$RELEASE_TAG" CampusHubAgent
          docker build -t "campushub-backend:$RELEASE_TAG" CampusHubBackend
          docker build -t "campushub-web:$RELEASE_TAG" CampusHubWeb

      - name: Bundle Docker images
        if: inputs.use_existing_bundle != 'true'
        run: |
          mkdir -p artifacts
          docker save \
            "campushub-agent:$RELEASE_TAG" \
            "campushub-backend:$RELEASE_TAG" \
            "campushub-web:$RELEASE_TAG" \
            | gzip > "artifacts/campushub-images-$RELEASE_TAG.tar.gz"
          ls -lh "artifacts/campushub-images-$RELEASE_TAG.tar.gz"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote directories
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases' '$DEPLOY_PATH/backups' '$DEPLOY_PATH/scripts/server'"

      - name: Upload release bundle and deployment files
        if: inputs.use_existing_bundle != 'true'
        run: |
          scp -P "$DEPLOY_PORT" \
            "artifacts/campushub-images-$RELEASE_TAG.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/releases/"

          scp -P "$DEPLOY_PORT" \
            docker-compose.prod.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.prod.yml"

          scp -P "$DEPLOY_PORT" \
            scripts/server/deploy-release.sh \
            scripts/server/rollback-release.sh \
            scripts/server/smoke-test.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/scripts/server/"

      - name: Upload deployment files only
        if: inputs.use_existing_bundle == 'true'
        run: |
          scp -P "$DEPLOY_PORT" \
            docker-compose.prod.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.prod.yml"

          scp -P "$DEPLOY_PORT" \
            scripts/server/deploy-release.sh \
            scripts/server/rollback-release.sh \
            scripts/server/smoke-test.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/scripts/server/"

      - name: Deploy release
        run: |
          if [ "$USE_EXISTING_BUNDLE" = "true" ]; then
            remote_bundle="releases/campushub-images-$RELEASE_TAG.tar"
            if ! ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "test -f '$DEPLOY_PATH/$remote_bundle'"; then
              remote_bundle="releases/campushub-images-$RELEASE_TAG.tar.gz"
            fi
            ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "test -f '$DEPLOY_PATH/$remote_bundle'"
          else
            remote_bundle="releases/campushub-images-$RELEASE_TAG.tar.gz"
          fi

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && chmod +x scripts/server/*.sh && scripts/server/deploy-release.sh '$RELEASE_TAG' '$remote_bundle' '$PUBLIC_BASE_URL'"

      - name: External smoke test
        run: |
          bash scripts/server/smoke-test.sh "$PUBLIC_BASE_URL"
