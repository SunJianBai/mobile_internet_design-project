name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CampusHubBackend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: |
          chmod +x mvnw
          ./mvnw -DskipTests compile

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CampusHubWeb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: CampusHubWeb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  agent:
    name: Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CampusHubAgent
    env:
      PYTHONNOUSERSITE: "1"
      SILICONFLOW_API_KEY: ci-dummy-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: CampusHubAgent/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import application
        run: python -s -c "import app.main; print(app.main.app.title)"

  app-config:
    name: App Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate uni-app JSON files
        run: |
          node -e "const fs=require('fs'); for (const f of ['CampusHubApp/package.json','CampusHubApp/manifest.json','CampusHubApp/pages.json']) { JSON.parse(fs.readFileSync(f,'utf8')); console.log(f + ' ok') }"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - web
      - agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production images
        run: |
          tag="ci-${GITHUB_SHA::7}"
          docker build -t "campushub-agent:$tag" CampusHubAgent
          docker build -t "campushub-backend:$tag" CampusHubBackend
          docker build -t "campushub-web:$tag" CampusHubWeb
